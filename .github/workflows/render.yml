name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "voiceover.txt"
      - "package.json"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2

      - name: Install packages
        run: npm install --legacy-peer-deps

      # Optional voiceover. If public/voiceover.mp3 is already in the repo (your own recording),
      # it is used as is. Otherwise a free text-to-speech voice is generated from voiceover.txt.
      # If that fails, the video simply renders without sound.
      - name: Voiceover
        continue-on-error: true
        run: |
          if [ ! -s public/voiceover.mp3 ]; then
            pip install edge-tts
            mkdir -p public
            edge-tts --file voiceover.txt --voice en-US-AndrewNeural --rate=+8% --write-media public/voiceover.mp3
          fi

      - name: Render
        run: |
          if [ -s public/voiceover.mp3 ]; then PROPS='{"voiceover":true}'; else PROPS='{"voiceover":false}'; fi
          mkdir -p public out
          npx remotion render WifiThroughWalls out/wifi-through-walls.mp4 --gl=swangle --concurrency=2 --props="$PROPS"

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-through-walls
          path: out/wifi-through-walls.mp4
